<html>
  <head>
<style>

body {
  font-family: 'Arial', sans-serif;
  background-color: #121212;
  color: #ffffff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #1e1e1e;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
  width: 350px;
  text-align: center;
}

h2 {
  margin-bottom: 20px;
  font-size: 22px;
  font-weight: bold;
}

.form-group {
  margin-bottom: 15px;
  text-align: left;
}

label {
  display: block;
  margin-bottom: 5px;
  font-weight: bold;
  color: #ffffff;
}

input {
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 5px;
  background: #333;
  color: #ffffff;
  outline: none;
}

input::placeholder {
  color: #aaa;
}

button {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s ease-in-out;
}

button[type="submit"] {
  background: #ffffff;
  color: #000000;
}

button[type="submit"]:disabled {
  background: #555;
  cursor: not-allowed;
}

button[type="button"] {
  background: #333;
  color: #ffffff;
}

button:hover {
  opacity: 0.8;
}

.text-danger {
  color: #ff4d4d;
  font-size: 12px;
}



</style>
  </head>
  <body>


    <div class="container">
      <h2>Validation du code</h2>
      <form [formGroup]="validateCodeForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="code">Code de validation</label>
          <input type="text" id="code" formControlName="code" placeholder="Entrez le code à 4 chiffres" />
          <div *ngIf="validateCodeForm.get('code')?.invalid && validateCodeForm.get('code')?.touched">
            <small class="text-danger">Veuillez entrer un code à 4 chiffres.</small>
          </div>
        </div>
        
        <button type="submit" [disabled]="validateCodeForm.invalid">Valider</button>
        <button type="button" (click)="goToLogin()">Annuler</button>
      </form>
    </div>
    
  </body>
</html>
