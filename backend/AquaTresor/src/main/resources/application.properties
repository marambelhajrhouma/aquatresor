spring.application.name=aquatresor


# La connexion avec postgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/aquatresordatabase 
#aquatresordatabase
#aquatresordb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
server.port=8089

#le root vers l'app
server.servlet.context-path=/aquatresor

#debuging the logging fro Spering Security
logging.level.org.springframework.security=DEBUG